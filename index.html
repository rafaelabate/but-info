<!doctype html>
<html lang="fr" class="verrouille">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BUT Info</title>
<meta name="description" content="Tableau de bord personnel de BUT Informatique : emploi du temps en direct, échéances, modules, révisions.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="theme-color" content="#e8eef8">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BUT Info">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="vendor/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/vues/aujourdhui.css">
<link rel="stylesheet" href="css/vues/planning.css">
<link rel="stylesheet" href="css/vues/afaire.css">
<link rel="stylesheet" href="css/vues/cours.css">
<link rel="stylesheet" href="css/vues/reviser.css">
<link rel="stylesheet" href="css/vues/reglages.css">
</head>
<body>
<div class="fond" aria-hidden="true"><div class="tache t1"></div><div class="tache t2"></div><div class="tache t3"></div><div class="tache t4"></div><div class="grain"></div></div>

<div class="barre-compacte" aria-hidden="true"><span id="titre-compact"></span></div>

<main class="app" id="app">
  <div class="contenu">
    <header class="entete">
      <div class="titres">
        <div class="surtitre" id="surtitre"></div>
        <h1 id="titre">BUT Info</h1>
      </div>
      <div class="actions">
        <button class="synchro verre" id="synchro" type="button" aria-label="État de la synchronisation"><span class="led"></span><span>Chargement</span></button>
        <button class="avatar" id="avatar" type="button" aria-label="Réglages">·</button>
      </div>
    </header>
    <div id="vue" class="vue"></div>
  </div>
</main>

<nav class="onglets verre" id="onglets" aria-label="Sections">
  <span class="goutte" aria-hidden="true"></span>
  <a href="#/aujourdhui" data-vue="aujourdhui"><svg class="ic" aria-hidden="true"><use href="#i-soleil"/></svg><span>Aujourd’hui</span></a>
  <a href="#/planning" data-vue="planning"><svg class="ic" aria-hidden="true"><use href="#i-calendrier"/></svg><span>Planning</span></a>
  <a href="#/afaire" data-vue="afaire"><svg class="ic" aria-hidden="true"><use href="#i-coches"/></svg><span>À faire</span><b class="pastille" hidden></b></a>
  <a href="#/cours" data-vue="cours"><svg class="ic" aria-hidden="true"><use href="#i-livre"/></svg><span>Cours</span></a>
  <a href="#/reviser" data-vue="reviser"><svg class="ic" aria-hidden="true"><use href="#i-lampe"/></svg><span>Réviser</span></a>
</nav>

<section class="verrou" id="verrou" aria-label="Déverrouillage">
  <div class="fond" aria-hidden="true"><div class="tache t1"></div><div class="tache t2"></div><div class="tache t3"></div><div class="tache t4"></div><div class="grain"></div></div>
  <div>
    <div class="verrou-date" id="verrou-date">&nbsp;</div>
    <div class="verrou-heure" id="verrou-heure">&nbsp;</div>
  </div>
  <form class="verrou-carte verre" id="verrou-form" autocomplete="on">
    <div class="verrou-cadenas"><svg class="ic" aria-hidden="true"><use href="#i-cadenas"/></svg></div>
    <h1>BUT Info</h1>
    <p>Entre ton code d’accès pour ouvrir ton tableau de bord.</p>
    <input class="cache-visuel" type="text" name="username" autocomplete="username" value="BUT Info" tabindex="-1" aria-hidden="true">
    <div class="champ">
      <input id="verrou-code" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="mot-mot-mot-mot-00" aria-label="Code d’accès" required>
      <button class="bouton rond petit" id="verrou-voir" type="button" aria-label="Afficher le code" style="background:transparent;color:#fff;width:34px;height:34px"><svg class="ic" aria-hidden="true"><use href="#i-oeil"/></svg></button>
      <button class="bouton rond" type="submit" aria-label="Déverrouiller"><svg class="ic" aria-hidden="true"><use href="#i-fleche"/></svg></button>
    </div>
    <p class="aide" id="verrou-aide">Code demandé une seule fois par appareil.</p>
  </form>
</section>

<noscript><p style="padding:24px;font:16px system-ui">Ce tableau de bord a besoin de JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
